<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Store</title>
    <link rel="stylesheet" href="/public/booking/storefront.css" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="store-header">
        <div class="header-inner">
          <a class="brand-lockup" href="#" aria-label="Store home">
            <span id="brandMark" class="brand-mark">S</span>
            <span>
              <strong id="businessName">Store</strong>
              <small id="businessLocation"></small>
            </span>
          </a>
          <div class="header-actions" aria-label="Store actions">
            <button id="wishlistButton" class="icon-action" type="button" aria-label="Wishlist">
              <span aria-hidden="true">♡</span>
              <b id="wishlistCount">0</b>
            </button>
            <button id="cartButton" class="icon-action primary" type="button" aria-label="Cart">
              <span aria-hidden="true">🛒</span>
              <b id="cartCount">0</b>
            </button>
          </div>
        </div>
      </header>

      <main>
        <section id="catalogView" class="catalog-layout">
          <aside class="filters-panel" aria-label="Product filters">
            <div class="filter-group">
              <label for="searchInput">Search</label>
              <input id="searchInput" type="search" placeholder="Search products" autocomplete="off" />
            </div>
            <div class="filter-group">
              <label for="categoryFilter">Category</label>
              <select id="categoryFilter">
                <option value="">All categories</option>
              </select>
            </div>
            <div class="filter-group">
              <label for="sortFilter">Sort</label>
              <select id="sortFilter">
                <option value="featured">Featured</option>
                <option value="price-asc">Price: low to high</option>
                <option value="price-desc">Price: high to low</option>
                <option value="name">Name</option>
              </select>
            </div>
          </aside>

          <section class="products-section" aria-live="polite">
            <div class="section-heading">
              <div>
                <p id="storeKicker" class="kicker">Product catalog</p>
                <h1 id="storeTitle">Shop products</h1>
              </div>
              <p id="resultCount" class="result-count"></p>
            </div>
            <div id="productGrid" class="product-grid"></div>
            <div id="emptyState" class="empty-state" hidden>
              <strong>No products found</strong>
              <span>Try a different search or category.</span>
            </div>
          </section>
        </section>

        <section id="checkoutView" class="checkout-layout" hidden>
          <button id="backToCatalog" class="text-button" type="button">Back to products</button>
          <div class="checkout-grid">
            <form id="checkoutForm" class="checkout-form">
              <div class="section-heading compact">
                <div>
                  <p class="kicker">Checkout</p>
                  <h1>Delivery details</h1>
                </div>
              </div>
              <label>Name <input id="customerName" name="name" autocomplete="name" required /></label>
              <label>Phone <input id="customerPhone" name="phone" autocomplete="tel" required /></label>
              <label>Email <input id="customerEmail" name="email" autocomplete="email" /></label>
              <label>Address <textarea id="customerAddress" name="address" rows="3" autocomplete="street-address" required></textarea></label>
              <label>Pincode <input id="customerPincode" name="pincode" inputmode="numeric" autocomplete="postal-code" /></label>
              <label>Notes <textarea id="customerNotes" name="notes" rows="3"></textarea></label>
              <button id="placeOrderButton" class="checkout-button" type="submit">Place order</button>
              <p id="checkoutMessage" class="checkout-message" role="status"></p>
            </form>

            <aside class="order-summary">
              <h2>Order summary</h2>
              <div id="summaryItems" class="summary-items"></div>
              <div class="summary-row">
                <span>Subtotal</span>
                <strong id="summarySubtotal">₹0</strong>
              </div>
              <p class="summary-note">Payment and delivery confirmation will be handled by the business.</p>
            </aside>
          </div>
        </section>
      </main>

      <aside id="cartDrawer" class="drawer" aria-label="Cart" aria-hidden="true">
        <div class="drawer-panel">
          <div class="drawer-header">
            <h2>Cart</h2>
            <button id="closeCart" class="close-button" type="button" aria-label="Close cart">×</button>
          </div>
          <div id="cartItems" class="cart-items"></div>
          <div class="drawer-footer">
            <div class="summary-row">
              <span>Total</span>
              <strong id="cartTotal">₹0</strong>
            </div>
            <button id="checkoutButton" class="checkout-button" type="button">Checkout</button>
          </div>
        </div>
      </aside>
    </div>
    <script src="/public/booking/storefront.js"></script>
  </body>
</html>
