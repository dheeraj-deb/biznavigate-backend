version: '3.9'

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    ports:
      - '3000:3000'
    env_file: ../.env
    depends_on:
      - redis
    restart: unless-stopped

  agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent
    env_file: ../.env
    depends_on:
      - redis
    restart: unless-stopped
    # Scale agent workers independently
    deploy:
      replicas: 2

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
